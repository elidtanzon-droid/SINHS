<dialog id="chatDialog">
  <div class="dialog-content">
    <h2>Start a New Chat</h2>

    <div class="chat-type-buttons">
      <button type="button" id="directChatTab" class="primary-button">
        Direct Chat
      </button>

      <button type="button" id="groupChatTab" class="secondary-button">
        Create Group
      </button>
    </div>

    <!-- Direct Chat -->
    <div id="directChatSection">
      <p>Select a student or teacher.</p>

      <div id="userList" class="user-list">
        <p>Loading users...</p>
      </div>
    </div>

    <!-- Group Chat -->
    <div id="groupChatSection" style="display: none;">
      <label for="groupName">Group Name</label>

      <input
        type="text"
        id="groupName"
        placeholder="Enter group name"
        maxlength="100"
      />

      <p>Select members:</p>

      <div id="groupUserList" class="user-list">
        <p>Loading users...</p>
      </div>

      <button
        type="button"
        id="createGroupBtn"
        class="primary-button"
      >
        Create Group
      </button>
    </div>

    <div class="dialog-buttons">
      <button
        type="button"
        id="cancelChatBtn"
        class="secondary-button"
      >
        Cancel
      </button>
    </div>
  </div>
</dialog>
