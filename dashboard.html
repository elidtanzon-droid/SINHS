<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SINHS Portal</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <h2>SINHS</h2>

    <nav>

      <button data-section="home">
        Dashboard
      </button>

      <button data-section="messages">
        Messages
      </button>

      <button data-section="announcements">
        Announcements
      </button>

    </nav>

    <button id="logoutBtn" class="logout">
      Log Out
    </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <div>

        <h1 id="pageTitle">
          Dashboard
        </h1>

        <p id="userName">
          Loading...
        </p>

      </div>

    </header>


    <!-- DASHBOARD -->

    <section id="home" class="section active">

      <div class="hero">

        <h2>
          Welcome to SINHS Portal
        </h2>

        <p>
          A centralized communication portal
          for students and teachers.
        </p>

      </div>

    </section>


    <!-- MESSAGES -->

    <section id="messages" class="section">

      <div class="section-header">

        <h2>
          Messages
        </h2>

        <button id="newChatBtn">
          New Chat
        </button>

      </div>


      <div class="messages-layout">

        <div
          id="conversationList"
          class="conversation-list">
        </div>


        <div class="chat-panel">

          <div
            id="chatHeader"
            class="chat-header">

            Select a conversation

          </div>


          <div
            id="messageList"
            class="message-list">
          </div>


          <form
            id="messageForm"
            class="message-form">

            <input
              id="messageInput"
              placeholder="Type a message..."
              autocomplete="off"
            >

            <input
              id="imageInput"
              type="file"
              accept="image/*"
            >

            <button type="submit">
              Send
            </button>

          </form>

        </div>

      </div>

    </section>


    <!-- ANNOUNCEMENTS -->

    <section id="announcements" class="section">

      <div class="section-header">

        <h2>
          Announcements
        </h2>

        <button
          id="newAnnouncementBtn"
          hidden>

          New Announcement

        </button>

      </div>


      <div id="announcementList"></div>

    </section>

  </main>

</div>


<!-- NEW CHAT -->

<dialog id="chatDialog">

  <form method="dialog" id="chatForm">

    <h3>
      Start a Chat
    </h3>

    <input
      id="userEmail"
      type="email"
      placeholder="User school email"
      required
    >

    <button value="default">
      Create Chat
    </button>

    <button value="cancel">
      Cancel
    </button>

  </form>

</dialog>


<!-- NEW ANNOUNCEMENT -->

<dialog id="announcementDialog">

  <form
    method="dialog"
    id="announcementForm">

    <h3>
      New Announcement
    </h3>

    <input
      id="announcementTitle"
      placeholder="Title"
      required
    >

    <textarea
      id="announcementBody"
      placeholder="Announcement"
      required>
    </textarea>

    <button value="default">
      Post
    </button>

    <button value="cancel">
      Cancel
    </button>

  </form>

</dialog>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/app.js"></script>

</body>
</html>
